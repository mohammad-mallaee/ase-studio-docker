# Run by hand from the Actions tab once the candidate image has been tested.
# Students get "latest" on their first start, or when they choose to update.
# Each run also adds a dated tag, which can be released again to roll back.
name: Release

on:
  workflow_dispatch:
    inputs:
      source:
        description: Image tag to release. To roll back, enter an earlier release tag.
        required: true
        default: candidate

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest and a dated tag at the source image
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_tag="release-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          docker buildx imagetools create -t "$image:latest" -t "$image:$release_tag" "$image:$SOURCE"
          echo "Released \`$SOURCE\` as \`latest\` and \`$release_tag\`." >> "$GITHUB_STEP_SUMMARY"
